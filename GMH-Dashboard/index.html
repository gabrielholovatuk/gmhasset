<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>GMH Asset Management — Dashboard</title>
  <meta name="description" content="Dashboard de cotações e gestão de carteiras GMH Asset Management" />
  <link rel="icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ══════════════════════ LOGIN ══════════════════════ -->
<div id="screen-login">
  <img src="img/logo.png" alt="GMH Asset Management" class="login-logo" />
  <div class="login-box">
    <h1 class="login-title">GMH Asset Management</h1>
    <p class="login-sub">Acesse sua área exclusiva</p>
    <form id="login-form" autocomplete="on">
      <div class="field-group">
        <label for="login-user">Usuário</label>
        <input id="login-user" type="text" placeholder="Digite seu usuário" autocomplete="username" required />
      </div>
      <div class="field-group">
        <label for="login-pass">Senha</label>
        <input id="login-pass" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="login-error" role="alert"></div>
      <button type="submit" id="login-btn" class="btn-primary" style="width:100%;margin-top:.5rem">Entrar</button>
    </form>
  </div>
</div>

<!-- ══════════════════════ APP SHELL ══════════════════════ -->
<div id="screen-app" class="hidden">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-logo-wrap">
      <img src="img/logo.png" alt="GMH" class="sidebar-logo" />
      <div class="sidebar-brand">GMH<span>Asset Management</span></div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-footer">
      <div class="user-avatar" id="user-avatar-letter">G</div>
      <div class="user-info">
        <div class="user-name" id="user-name">—</div>
        <span class="badge" id="user-badge"></span>
      </div>
      <button id="btn-logout" title="Sair">⏻</button>
    </div>
  </aside>
  <div id="sidebar-overlay"></div>

  <!-- Main -->
  <div id="main-content">
    <header id="app-header">
      <button id="btn-menu" aria-label="Menu">☰</button>
      <span class="header-title">GMH Asset Management</span>
      <span class="header-sub" id="header-sub">Dashboard</span>
    </header>
    <main id="page-content"></main>
  </div>
</div>

<!-- ══════════════════════ CDN LIBRARIES ══════════════════════ -->
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- jsPDF + html2canvas for PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- ══════════════════════ APP SCRIPTS ══════════════════════ -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/portfolios.js"></script>
<script src="js/pages/watchlist.js"></script>
<script src="js/pages/alerts.js"></script>
<script src="js/pages/report.js"></script>
<script src="js/app.js"></script>

</body>
</html>
